## Modified to have rules organized to the rules section at bottom, legacy options commented out.

# OPACITY
# inactive-opacity = 0.8;
# frame-opacity = 0.7;

# Let inactive opacity set by -i override the '_NET_WM_WINDOW_OPACITY' values of windows.
# inactive-opacity-override = true;

# if for some reason you want all windows transparent
# active-opacity = 1.0

# inactive-dim = 0.05

# fixed inactive dim value
# inactive-dim-fixed = 1.0

# focus-exclude = [ "class_g = 'dwm'" ];

# opacity-rule = [
    # "100:class_g = 'example'" 
# ];
#blur-background-exclude = [
#    "class_g = 'vivaldi-stable'",
#];


# ROUNDED CORNERS
corner-radius = 3 

# uncommented for square notification box
# rounded-corners-exclude = [
  # "class_g = 'Dunst'"
# ];


# BLURRING
# methods: none, gaussian, box, kernel (define custom kernel), dual_kawase
blur:
{
  method = "dual_kawase";
  size = 30;
  strength = 1;
# default deviation is 0.84
# deviation = false;
};

# semi-transparent
blur-background = true

# blur-background-frame = true
# Use fixed blur strength rather than adjusting according to window opacity.
# blur-background-fixed = true 

# set custom blur kernel (method to kernel), preset examples:
# blur-kern = "3x3box";
# blur-kern = "5x5gaussian";


# SHADOWS
# shadow = true; # this allows me to toggle on shadows solely for qutebrowser, to create a muted/blurred look behind tabs when combined with qutebrowser's transparent tabs setting.
shadow-radius = 1; # blur radius
shadow-opacity = 0.6

shadow-offset-x = 2;
shadow-offset-y = 3;

# shadow-color = "#000000"
# shadow-color = "#393943" # this could be set with a pywal template instead
# shadow-exclude = [];


# FADING
fading = true;

fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 1; 


# OTHER SETTINGS
# dbus = true
# daemon = false

# backends: `xrender`, `glx`, `egl` or `xr_glx_hybrid`
backend = "glx";

dithered-present = false;
vsync = true;

# mark-wmwin-focused = true;

# mark-ovredir-focused = true;

detect-rounded-corners = false
detect-client-opacity = true;
use-ewmh-active-win = true
detect-transient = true;
use-damage = true;
log-level = "warn";

# LEGACY
# wintypes:
# {
#   tooltip = { fade = true; shadow = true; opacity = 0.5; focus = true; full-shadow = false; };
#   dock = { shadow = false; clip-shadow-above = true; }
#   dnd = { shadow = false; }
#   popup_menu = { opacity = 0.7; }
#   dropdown_menu = { opacity = 0.7; }
#   normal = { opacity = 1;}
# };

# WINDDOW RULES
rules = (
	# { match = "name = 'dwm'"; opacity = 1; },
	{ match = "focused"; opacity = 0.85; },
	{ match = "!focused"; opacity = 0.65; },
	{ match = "tooltip"; fade = true; shadow = true; opacity = 0.5; focus = true; full-shadow = false; },
	{ match = "popup_menu"; opacity = 0.7; },
	{ match = "dropdown_menu"; opacity = 0.7; },
	{ match = "class_g = 'waterfox'"; blur-background = false; opacity = 1 },
	{ match = "class_g = 'TelegramDesktop'"; blur-background = false; opacity = 1 },
	{ match = "class_g = 'dmenu'"; blur-background = false; opacity = 1 },
	{ match = "class_g = 'Dunst'"; blur-background = false; opacity = 1 },
	{ match = "class_g = 'vxwm'"; blur-background = false; opacity = 1 },
	{ match = "class_g = 'md.obsidian.Obsidian'"; blur-background = false; opacity = 1 },
	{ match = "class_g = 'davinci-resolve-studio'"; blur-background = false; opacity = 1 },
)

# picom -b to daemonize
