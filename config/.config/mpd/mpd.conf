# Files and Directories
music_directory    "~/music"
playlist_directory "~/music/playlists"
db_file "~/.local/state/mpd/database"
#log_file           "~/.cache/mpd/log"
#pid_file           "~/.local/state/mpd/pid"
#state_file         "~/.local/state/mpd/state"
#sticker_file       "~/.local/state/mpd/sticker.sql"

# Network Settings
bind_to_address    "127.0.0.1"
port               "6600"
restore_paused     "yes"
auto_update        "yes"

# Audio Output (Modern PipeWire/PulseAudio setup)
audio_output {
        type "pipewire"
        name "PipeWire Sound Server"
}


# Alternative: Uncomment this if you are using standard PulseAudio instead of PipeWire
#audio_output {
#        type            "pulse"
#        name            "PulseAudio"
#}
